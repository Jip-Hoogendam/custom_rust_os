[package]
name = "cute_kernel"
version = "0.3.0"
edition = "2024"
license-file = "../LICENSE"
repository = "http://forgejo.servers/jhoogend/owos-prime"
readme = "./README.md"
keywords = ["OS", "Kernel"]
categories = ["OS", "Kernel"]
description = "The kernal of my own personal operating system"

[dependencies]
bootloader_api = "=0.11.15"
spin = "0.5.2"
x86_64 = { version = "=0.15.4", default-features = true }
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"

[dependencies.noto-sans-mono-bitmap]
version = "0.2.0"
default-features = false
features = [
  "regular",
  "size_16",
  "unicode-basic-latin",
  # required for the fallback char '�'
  "unicode-specials",
]

[dependencies.crossbeam-queue]
version = "0.3.12"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.4.0"
default-features = false

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]


[dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]


[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false
