[workspace]
resolver = "3"
members = ["cute_kernel"]

[package]
name = "owos-prime"
version = "0.1.0"
edition = "2024"
license-file = "./LICENSE"
repository = "http://forgejo.servers/jhoogend/owos-prime"
readme = "./README.md"
keywords = ["OS"]
categories = ["OS"]
description = "This is my personal hobby operating system."


[dependencies]
ovmf-prebuilt = "0.2.4"

[build-dependencies]
cute_kernel = { path = "cute_kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "=0.11.15"
